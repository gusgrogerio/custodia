name: Package Standalone ZIP

on:
  push:
    branches:
      - agent/standalone-migration

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create ZIP
        run: |
          zip -r d1-custodia-standalone.zip . \
            -x '.git/*' \
            -x 'node_modules/*' \
            -x 'frontend/node_modules/*' \
            -x '.env' \
            -x '*.zip'
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: d1-custodia-standalone
          path: d1-custodia-standalone.zip
          if-no-files-found: error
